# Included at server level and again in every location that sets its own
# add_header, because nginx drops inherited add_header lines in that case.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# The SPA loads only its own bundled scripts and styles. React `style={...}`
# props go through the CSSOM, which style-src does not restrict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
